{% extends "base.html" %}

{% block content %}
  <div class="container mt-5">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="card shadow-lg border-0">
          <div class="card-header bg-gradient-primary p-4">
            <h4 class="text-white mb-0">Delete { project.name }} ?</h4>
            <p class="text-danger text-bold">All Task assigned to this project will be also deleted!</p>
            <p class="text-info text-bold">Tasks in project: {{ project.tasks.count }}</p>
          </div>
          <form action="" method="post" style="display: inline-block">
            {% csrf_token %}
            <div class="d-flex align-items-center justify-content-end gap-4 p-2">

              <button type="submit" value="Yes" class="btn btn-danger">
                Yes
              </button>
              <a href="{% url 'manager:projects-list' %}" class="btn btn-info">No</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
