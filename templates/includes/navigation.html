{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-white py-3 shadow-none">
  <div class="container">
    <a class="navbar-brand font-weight-bolder ms-lg-0 ms-3" href="{% url 'index' %}">
      TASKI MANAGER
    </a>
    <button class="navbar-toggler shadow-none ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon mt-2">
        <span class="navbar-toggler-bar bar1"></span>
        <span class="navbar-toggler-bar bar2"></span>
        <span class="navbar-toggler-bar bar3"></span>
      </span>
    </button>
    <div class="collapse navbar-collapse w-100 pt-3 pb-2 py-lg-0" id="navigation">
      <ul class="navbar-nav navbar-nav-hover ms-auto">

        <li class="nav-item mx-2">
          <a class="nav-link ps-2 d-flex cursor-pointer align-items-center" href="#">
            <i class="material-icons opacity-6 me-2 text-md">assignment</i>
            Zadania
          </a>
        </li>

        <li class="nav-item mx-2">
          <a class="nav-link ps-2 d-flex cursor-pointer align-items-center" href="#">
            <i class="material-icons opacity-6 me-2 text-md">folder</i>
            Projekty
          </a>
        </li>

        <li class="nav-item mx-2">
          <a class="nav-link ps-2 d-flex cursor-pointer align-items-center" href="#">
            <i class="material-icons opacity-6 me-2 text-md">people</i>
            Zespół
          </a>
        </li>

        <li class="nav-item dropdown dropdown-hover mx-2">
          <a class="nav-link ps-2 d-flex cursor-pointer align-items-center" id="dropdownMenuUser" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="material-icons opacity-6 me-2 text-md">account_circle</i>
            Konto
            <img src="{% static 'img/down-arrow-dark.svg' %}" alt="down-arrow" class="arrow ms-auto ms-md-2">
          </a>
          <div class="dropdown-menu dropdown-menu-end dropdown-menu-animation p-3 border-radius-lg mt-0 mt-lg-3" aria-labelledby="dropdownMenuUser">
            {% if request.user.is_authenticated %}
              <h6 class="dropdown-header text-dark font-weight-bolder px-1">Witaj, {{ request.user.username }}</h6>
              <a href="#" class="dropdown-item border-radius-md">Profil</a>
              <hr class="horizontal dark my-2">
              <a href="{% url 'logout' %}" class="dropdown-item border-radius-md text-danger">Wyloguj się</a>
            {% else %}
              <a href="{% url 'login' %}" class="dropdown-item border-radius-md">Zaloguj się</a>
            {% endif %}
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>
